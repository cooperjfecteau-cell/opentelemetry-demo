# Builds the workshop images: the assistant, the product catalog, and the catalog
# satellites. Every branch gets a tag named after it, so a defect branch can be rolled
# out by tag without rebuilding the whole demo.
name: workshop-images

on:
  push:
    paths:
      - "src/shop-assistant/**"
      - "src/shared/**"
      - "src/product-catalog/**"
      - "src/catalog-satellite/**"
      - ".github/workflows/workshop-agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: astroshop-agent
            context: src/shop-assistant
            dockerfile: src/shop-assistant/Dockerfile
          - name: astroshop-product-catalog
            context: src/product-catalog
            dockerfile: src/product-catalog/Dockerfile
          - name: astroshop-catalog-satellite
            context: src/catalog-satellite
            dockerfile: src/catalog-satellite/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.branch }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Pipeline observability: tell Dynatrace which image was built from which commit, so the
      # SDLC timeline shows the SKU commit next to the deployment and the problem. Skipped
      # until the repository has the DT_SDLC_TOKEN secret (platform token, scope
      # openpipeline:events.sdlc:ingest) and the DT_ENVIRONMENT variable: the classic
      # environment URL (https://<env>.live.dynatrace.com style, not the .apps. host, which
      # answers 404 for the ingest paths).
      - name: Report build to Dynatrace (SDLC event)
        if: ${{ env.DT_SDLC_TOKEN != '' && env.DT_ENVIRONMENT != '' }}
        env:
          DT_SDLC_TOKEN: ${{ secrets.DT_SDLC_TOKEN }}
          DT_ENVIRONMENT: ${{ vars.DT_ENVIRONMENT }}
          IMAGE: ${{ matrix.name }}
          TAG: ${{ steps.tag.outputs.branch }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          service="${IMAGE#astroshop-}"; [ "$service" = agent ] && service=shop-assistant
          title=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          payload=$(jq -n --arg image "$IMAGE" --arg tag "$TAG" --arg sha "$SHA" --arg branch "$BRANCH" \
            --arg run "$RUN_ID" --arg repo "$REPO" --arg msg "$title" --arg service "$service" \
            --arg url "https://github.com/$REPO/actions/runs/$RUN_ID" \
            --arg commit_url "https://github.com/$REPO/commit/$SHA" '{
              "event.provider": "github.com", "event.type": "build", "event.category": "task",
              "event.status": "finished", "task.name": ("build " + $image), "task.id": ($run + "-" + $image),
              "task.outcome": "Success",
              "cicd.pipeline.name": "workshop-images", "cicd.pipeline.run.id": $run, "cicd.pipeline.run.url.full": $url,
              "vcs.repository.name": $repo, "vcs.repository.url.full": ("https://github.com/" + $repo),
              "vcs.ref.head.name": $branch, "vcs.ref.head.revision": $sha,
              "vcs.change.title": $msg, "vcs.change.url.full": $commit_url,
              "artifact.name": ("ghcr.io/" + ($repo | split("/")[0]) + "/" + $image), "artifact.version": $tag,
              "service.name": $service, "k8s.namespace.name": "astroshop", "workshop": "astroshop"
            }')
          code=$(curl -s -o /tmp/sdlc.out -w '%{http_code}' -X POST "$DT_ENVIRONMENT/platform/ingest/v1/events.sdlc" \
            -H "Authorization: Bearer $DT_SDLC_TOKEN" -H "Content-Type: application/json" -d "$payload")
          echo "SDLC event for $IMAGE:$TAG -> HTTP $code"; cat /tmp/sdlc.out; echo
          [ "$code" = 202 ] || echo "::warning::Dynatrace SDLC event not accepted (HTTP $code)"
