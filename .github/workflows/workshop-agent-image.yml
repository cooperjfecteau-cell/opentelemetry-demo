# Builds the workshop images: the assistant, the product catalog, and the catalog
# satellites. Every branch gets a tag named after it, so a defect branch can be rolled
# out by tag without rebuilding the whole demo.
name: workshop-images

on:
  push:
    paths:
      - "src/shop-assistant/**"
      - "src/shared/**"
      - "src/product-catalog/**"
      - "src/catalog-satellite/**"
      - ".github/workflows/workshop-agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: astroshop-agent
            context: src/shop-assistant
            dockerfile: src/shop-assistant/Dockerfile
          - name: astroshop-product-catalog
            context: src/product-catalog
            dockerfile: src/product-catalog/Dockerfile
          - name: astroshop-catalog-satellite
            context: src/catalog-satellite
            dockerfile: src/catalog-satellite/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.branch }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
