# Builds only the agent image for the Bluebox workshop. Every branch gets a tag
# named after it, so a "v2" branch can be rolled out by tag without rebuilding
# the whole demo.
name: workshop-agent-image

on:
  push:
    paths:
      - "src/agent/**"
      - "src/shared/**"
      - ".github/workflows/workshop-agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/agent/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/astroshop-agent:${{ steps.tag.outputs.branch }}
            ghcr.io/${{ github.repository_owner }}/astroshop-agent:${{ steps.tag.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
