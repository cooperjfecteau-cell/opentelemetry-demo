org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dynatrace provisioning. These are placeholders on purpose: the real tenant values come from the
# DT_REGISTER_APP_ID / DT_REGISTER_BEACON_URL environment variables (infra/secrets.env), which are
# never committed. The root build file prefers the environment over these.
dt.register.appId=DT_REGISTER_APP_ID_PLACEHOLDER
dt.register.beaconUrl=https://REPLACE-ME.live.dynatrace.com/mbeacon

# Where the register reaches Astro Shop's frontend-proxy. 10.0.2.2 is the emulator's route to the
# host, which is how the fleet host exposes the LoadBalancer. Override with ASTROSHOP_BASE_URL.
astroshop.baseUrl=http://10.0.2.2:8080
